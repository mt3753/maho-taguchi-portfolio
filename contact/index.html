<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maho taguchi portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital@0;1&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <header id="header">
    <h1 class="logo">
      <a href="../index.html">
        <img src="../images/logo_header@2x.png" alt="maho taguchi"/>
      </a>
    </h1>
    <nav class="header_nav">
      <ul>
        <li><a href="../about/index.html">About me</a></li>
        <li><a href="../works/index.html">Works</a></li>
        <li><a href="../contact/index.html">Contact</a></li>
      </ul>
    </nav>
    <button class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>    
  </header>

  <h1 class="page_title">Contact</h1>  

  <p class="contact_sub">ご覧いただきありがとうございます。<br>もし少しでも「気になる」と思っていただけましたら、お気軽にお問い合せください。</p>

  <div class="c-form">
    <form 
    action="https://docs.google.com/forms/u/0/d/e/1FAIpQLScbtDSISFTvB_KcIN-2Q5pKMFc6fwbL_Chp9VerHEyYWe3MSQ/formResponse" 
    method="POST"
    target="hidden_iframe"
    onsubmit="submitted=true;"
    >

      <div class="c-form__item">
        <label class="c-form__label" for="field-name">
          お名前（必須）
        </label>

        <input
          name="entry.209087419"
          class="c-form__input"
          id="field-name"
          placeholder="例）山田 花子"
          type="text"
          required="required"
        />
      </div>

      <div class="c-form__item">
        <label class="c-form__label" for="field-company">
          会社名
        </label>    
        <input
          name="entry.1889246306"
          class="c-form__input"
          id="field-company"
          placeholder="例）株式会社HANACO"
          type="text"
        />
      </div>

      <div class="c-form__item">
        <label class="c-form__label" for="field-department">
          部署名
        </label>    
        <input
          name="entry.573279051"
          class="c-form__input"
          id="field-department"
          placeholder="例）人事部"
          type="text"
        />
      </div>

      <div class="c-form__item">
        <label class="c-form__label" for="field-email">
          メールアドレス（必須）
        </label>       
        <input
          name="entry.1124626016"
          class="c-form__input"
          id="field-email"
          placeholder="y.hanaco@mail.co.jp"
          type="text"
          required="required"
        />
      </div>      

      <div class="c-form__item">
        <label class="c-form__label" for="field-name">
          お問い合わせ内容（必須）
        </label>           
        <textarea
          name="entry.1260649415"
          class="c-form__input"
          id="field-message"
          placeholder="お問合せ内容を入力してください。"
          required="required"
        ></textarea>
      </div>
      
      <div class="c-form__submit">
        <button type="submit" class="btn">
          <span class="btn_title">送信する</span>
          <span class="btn_circle"><img src="../images/arrow.svg" alt="矢印"></span>
        </button>          
      </div>              

    </form>
  </div>

   <footer>
          <!--背景-->
          <div class="footer_bg">
            <img src="../images/footer.svg" alt="">
            <div class="footer_bg_rectangle"></div>
          </div>

          <div class="footer_inner">

            <!--フッターナビ-->
            <div class="footer_content">
              <img src="../images/logo_footer@2x.png" alt="ロゴマーク" class="footer_logo">
              <ul class="footer_nav">
                <li><a href="../about/index.html">About me</a></li>
                <li><a href="../works/index.html">Works</a></li>
                <li><a href="../contact/index.html">Contact</a></li>
              </ul>
              <p class="copy-right">©maho taguchi All Rights Reserved.</p>
            </div>

            <!--topへ戻るボタン-->
            <div class="back-to-top">
              <img src="../images/back_to_top.svg" alt="" class="back-to-top__flower">
              <span class="back-to-top__circle"></span>
              <span class="back-to-top__content">
                <img src="../images/back_to_top_arrow.svg" alt="" class="back-to-top__arrow">
                <span class="back-to-top__text">TOPに<br>戻る</span>
              </span>
            </div>

          </div>

        </footer>     
        
  <script type="text/javascript">
      let submitted = false;
  </script>
  <iframe
      name="hidden_iframe"
      id="hidden_iframe"
      style="display: none"
      onload="if(submitted){window.location='thanks.html';}"
  ></iframe>      

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- slickのJavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

  <script src="../script.js"></script>  

</body>
</html>
